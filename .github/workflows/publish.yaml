name: Build & Publish Api

run-name: "Publish (site_mode: ${{github.event.inputs.site_mode}}, dev: ${{github.event.inputs.dev}})"

on:
  workflow_dispatch:
    inputs:
      site_mode:
        description: Site mode
        required: true
        default: testing
        type: choice
        options:
        #- development
        - testing
        - production
      chinese:
        description: 'Build chinese?'
        required: true
        default: true
        type: boolean
      dev:
        description: 'Add --dev flag to build?'
        required: true
        default: false
        type: boolean

concurrency:
  group: terraform-api-site-${{ github.event.inputs.site_mode }}

env:
  CN: ${{ github.event.inputs.chinese }}
  mode: ${{github.event.inputs.site_mode}}
  teamlab_s3bucket: api-site-teamlab-info
  com_s3bucket: api-site-onlyoffice-com

jobs:
  start-runner:
    name: Start AWS Runner
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_RUNNER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_RUNNER_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Start EC2 instance if stopped
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids i-044ed631d831db1f1 --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Current instance state: ${STATE}"
          if [ "${STATE}" = "stopped" ]; then
            echo "Starting instance i-044ed631d831db1f1..."
            aws ec2 start-instances --instance-ids i-044ed631d831db1f1
            aws ec2 wait instance-running --instance-ids i-044ed631d831db1f1
            echo "Instance started successfully."
          else
            echo "Instance is already in state '${STATE}', skipping start."
          fi

  publish:
    runs-on: ubuntu-latest-max
    needs: start-runner
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Dependencies
      run: npm install
    
    - name: Build Packages
      id: build
      run: |
        LOCALE="--locale en"
        SUB_ARGS=""

        # Set SITE_MODE for docusaurus.config.ts (NODE_ENV is overridden by Docusaurus)
        export SITE_MODE="$mode"

        # Build CN locale string
        if [[ "$CN" == "true" ]]; then
           LOCALE="$LOCALE --locale zh-CN"
           # Docusaurus link issues fix
           # NOTE: Should be remove after the issue is be fixed
           mkdir -p i18n/zh-CN/docusaurus-plugin-content-docs-api/current2
           cp -r site/** i18n/zh-CN/docusaurus-plugin-content-docs-api/current2
           cp -r i18n/zh-CN/docusaurus-plugin-content-docs-api/current/** i18n/zh-CN/docusaurus-plugin-content-docs-api/current2
           rm -rf i18n/zh-CN/docusaurus-plugin-content-docs-api/current
           mv i18n/zh-CN/docusaurus-plugin-content-docs-api/current2 i18n/zh-CN/docusaurus-plugin-content-docs-api/current
        fi

        # Build sub-arguments string
        [[ "${{ github.event.inputs.dev }}" == "true" ]] && SUB_ARGS="--dev"

        free -h

        cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "Memory limit info not available"

        export NODE_OPTIONS="--max-old-space-size=42192"
        export UV_THREADPOOL_SIZE=16
        export RSPACK_PARALLEL=8
        export RAYON_NUM_THREADS=8
        export TOKIO_WORKER_THREADS=8
        npm run build -- ${SUB_ARGS} ${LOCALE}
    
    - name: Configure AWS Environment
      env:
        AWS_ACCESS_KEY_PROD: ${{secrets.AWS_ACCESS_KEY_PROD}}
        AWS_SECRET_KEY_PROD: ${{secrets.AWS_SECRET_KEY_PROD}}
        AWS_DISTRIBUTION_ID_PROD: ${{secrets.AWS_DISTRIBUTION_ID_PROD}}
        AWS_ACCESS_KEY_TEST: ${{secrets.AWS_ACCESS_KEY_TEST}}
        AWS_SECRET_KEY_TEST: ${{secrets.AWS_SECRET_KEY_TEST}}
        AWS_DISTRIBUTION_ID_TEST: ${{secrets.AWS_DISTRIBUTION_ID_TEST}}
      run: |
        # AWS_BUCKET_URL is declared later from the Terraform state
        if [ "${mode}" = "production" ]; then
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_PROD}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY_PROD}" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          echo "AWS_DISTRIBUTION_ID=${AWS_DISTRIBUTION_ID_PROD}" >> "$GITHUB_ENV"
          echo "CF_TF_DIR=infra/cloudfront-distributions-com/api-site" >> "$GITHUB_ENV"
          echo "S3_BASE=${com_s3bucket}" >> "$GITHUB_ENV"
        elif [ "${mode}" = "testing" ]; then
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_TEST}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY_TEST}" >> "$GITHUB_ENV"
          echo "AWS_DISTRIBUTION_ID=${AWS_DISTRIBUTION_ID_TEST}" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          echo "CF_TF_DIR=infra/cloudfront-distributions-test/api-site" >> "$GITHUB_ENV"
          echo "S3_BASE=${teamlab_s3bucket}" >> "$GITHUB_ENV"
        elif [ "${mode}" = "development" ]; then
          echo "Development bucket dose not exist"
          exit 1
        else
          echo "Invalid site mode: $m"
          exit 1
        fi

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{env.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{env.AWS_SECRET_ACCESS_KEY}}
        aws-region: ${{env.AWS_REGION}}

    # --- Origin bucket and CloudFront are managed by Terraform ---
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        github-api-url: https://api.github.com
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: ${{ secrets.INFRA_REPO_OWNER }}
        repositories: ${{ secrets.INFRA_REPO_NAME }}

    - name: Checkout infra repo
      uses: actions/checkout@v4
      with:
        github-server-url: https://github.com
        repository: ${{ secrets.INFRA_REPO_OWNER }}/${{ secrets.INFRA_REPO_NAME }}
        token: ${{ steps.app-token.outputs.token }}
        path: infra
        sparse-checkout: |
          cloudfront-distributions-test/api-site
          cloudfront-distributions-com/api-site

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Declare target bucket from Terraform state
      working-directory: ${{ env.CF_TF_DIR }}
      run: |
        terraform init -input=false
        CURRENT=$(terraform output -raw api_site_origin_bucket)
        if [ "$CURRENT" = "${S3_BASE}1" ]; then
          TARGET="${S3_BASE}2"
        else
          TARGET="${S3_BASE}1"
        fi
        echo "Current origin bucket: ${CURRENT}, target: ${TARGET}"
        echo "AWS_BUCKET_URL=s3://${TARGET}" >> "$GITHUB_ENV"
        echo "TARGET_BUCKET=${TARGET}" >> "$GITHUB_ENV"

    - name: Sync AWS Bucket
      id: sync
      working-directory: build
      run: |
          # Define all possible languages
          # EN all time build by default and not specifyed in this array
          ALL_LANGS=("zh-CN")

          # Languages that were actually built
          BUILT_LANGS=("en")  # Modify this dynamically
          # Add dynamically built languages
          [[ "$CN" == "true" ]] && BUILT_LANGS+=("zh-CN")

          # Generate exclusion flags
          EXCLUDE_FLAGS=()
          for lang in "${ALL_LANGS[@]}"; do
            should_exclude=true
            for lg in "${BUILT_LANGS[@]}"; do
              if [[ "$lang" == "$lg" ]]; then
                should_exclude=false
                break  # Stop checking once we find a match
              fi
            done

            if [[ "$should_exclude" == true ]]; then
              EXCLUDE_FLAGS+=("--exclude \"${lang}/*\"")
            fi
          done

          # Convert array to string
          EXCLUDE_STR=$(IFS=" " ; echo "${EXCLUDE_FLAGS[*]}")

          # Increase S3 transfer concurrency (default is 10)
          aws configure set default.s3.max_concurrent_requests 50

           echo "Step 1: Sync HTML files with short cache"
           eval "aws s3 sync . ${{env.AWS_BUCKET_URL}} \
                --exclude \"*\" \
                --include \"*.html\" \
                --cache-control \"public, max-age=0, must-revalidate\" \
                --content-type \"text/html\" \
                --delete \
                $EXCLUDE_STR"

           echo "Step 2: Sync hashed assets (JS/CSS) with long cache"
           eval "aws s3 sync . ${{env.AWS_BUCKET_URL}} \
                --exclude \"*\" \
                --include \"*.js\" \
                --include \"*.css\" \
                --cache-control \"public, max-age=31536000, immutable\" \
                --delete \
                $EXCLUDE_STR"

           echo "Step 3: Sync all other files"
           eval "aws s3 sync . ${{env.AWS_BUCKET_URL}} \
                --exclude \"*.html\" \
                --exclude \"*.js\" \
                --exclude \"*.css\" \
                --include \"*\" \
                --cache-control \"public, max-age=86400\" \
                --delete \
                $EXCLUDE_STR"

          # Compress files more than 10mb manually
          echo "Find and compress files larger than 10MB"
          BUILD_DIR="."
          find "$BUILD_DIR" -type f \( -name "*.js" -o -name "*.json" -o -name "*.htm" \
            -o -name "*.html" -o -name "*.css" -o -name "*.bin" -o -name "*.wasm" -o -name "*.dic" -o -name "*.aff" -o -name "*.svg" \) \
            -size +10M \
            | while read -r file; do
            echo "Compress: $file"
            gzip -9 -c "$file" > "$file.gz" && mv "$file.gz" "$file"
            MIME_TYPE=$(file --mime-type -b "$file")

            if [[ "$file" == *.js ]] || [[ "$file" == *.css ]]; then
              CACHE_CONTROL="public, max-age=31536000, immutable"
            elif [[ "$file" == *.html ]]; then
              CACHE_CONTROL="public, max-age=0, must-revalidate"
            else
              CACHE_CONTROL="public, max-age=86400"
            fi

            echo "Upload: $file (cache: $CACHE_CONTROL)"
            aws s3 cp "$file" "${{ env.AWS_BUCKET_URL }}/${file#./}" \
            --content-encoding gzip \
            --content-type "$MIME_TYPE" \
            --cache-control "$CACHE_CONTROL"
          done

    - name: Switch CloudFront origin via Terraform
      id: cfconf_tf
      working-directory: ${{ env.CF_TF_DIR }}
      run: |
          # backup current distribution config (attached to the telegram alert)
          aws cloudfront get-distribution-config --id "${AWS_DISTRIBUTION_ID}" > ../../../cf_config_backup.json

          # wait_for_deployment=true in the module: apply returns when the distribution is Deployed
          terraform apply -auto-approve -input=false -var "api_site_s3_bucket_name=${TARGET_BUCKET}"

    - name: Invalidate AWS CloudFront Cache
      run: |
         aws cloudfront create-invalidation --distribution-id ${{env.AWS_DISTRIBUTION_ID}} --paths '/*'

    - name: Collect statuses
      if: always()
      env:
        BUILD_STATUS: ${{ steps.build.outcome }}
        SYNC_STATUS: ${{ steps.sync.outcome }}
        CF_CONF_STATUS: ${{ steps.cfconf_tf.outcome }}
      run: |
          if [[ "$BUILD_STATUS" == 'failure' ]]; then
             echo "BUILD_STATUS=failure🔴" >> $GITHUB_ENV
             echo "SYNC_STATUS=skipped" >> $GITHUB_ENV
          fi
          if [[ "$BUILD_STATUS" == 'success' ]]; then
             echo "BUILD_STATUS=success🟢" >> $GITHUB_ENV
             [[ "$SYNC_STATUS" == 'failure' ]] && echo "SYNC_STATUS=failure🔴" >> $GITHUB_ENV
             [[ "$SYNC_STATUS" == 'success' ]] && echo "SYNC_STATUS=success🟢" >> $GITHUB_ENV
             [[ "$CF_CONF_STATUS" == 'failure' ]] && echo "CF_CONF_STATUS=failure🔴" >> $GITHUB_ENV
             [[ "$CF_CONF_STATUS" == 'success' ]] && echo "CF_CONF_STATUS=success🟢" >> $GITHUB_ENV
          fi

    - name: Send alert message
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        document: ./cf_config_backup.json
        message: |
            ${{ github.actor }} created commit:
            Commit message: ${{ github.event.commits[0].message }}

            Repository: ${{ github.repository }}
            Action: ${{ github.event_name }}
            Workflow: ${{ github.workflow }}
            Mode: ${{ github.event.inputs.site_mode }}

            Api build status: ${{ env.BUILD_STATUS }}
            Api s3 sync status: ${{ env.SYNC_STATUS }}
            CloudFront config update status: ${{ env.CF_CONF_STATUS }}

            See commit changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            See action run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
