name: ReBuild docspace-ui-kit

run-name: "ReBuild docspace-ui-kit"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Chromium and its system libraries come with the image. Keep its tag at the kit's
    # `@playwright/test` version, or `docs:build` downloads a second browser.
    container: mcr.microsoft.com/playwright:v1.58.1-noble
    timeout-minutes: 90

    steps:
      # Without git, actions/checkout falls back to a tarball with no .git, and the
      # commit at the end has nothing to commit into.
      - name: Install git
        run: command -v git || (apt-get update && apt-get install -y git)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout api.onlyoffice.com repository
        uses: actions/checkout@v4
        with:
          path: api.onlyoffice.com

      - name: Checkout docspace-ui-kit-react repository (branch)
        id: checkout_docspace_ui_kit
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/docspace-ui-kit-react
          token: ${{ secrets.READ_PAT }}
          ref: ${{ github.ref_name }}
          path: docspace-ui-kit-react

      - name: Checkout docspace-ui-kit-react repository (default)
        if: steps.checkout_docspace_ui_kit.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/docspace-ui-kit-react
          token: ${{ secrets.READ_PAT }}
          path: docspace-ui-kit-react

      # Takes the version from the kit's `packageManager` field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docspace-ui-kit-react/package.json

      - name: Set up Git
        # The container runs as root over a workspace the runner user owns.
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build docspace-ui-kit-react docs
        env:
          CI: true
        run: |
          cd docspace-ui-kit-react
          pnpm install --frozen-lockfile
          DOCS_REVISION=$(git rev-parse HEAD) pnpm docs:build
          cd ..

          rm -rf api.onlyoffice.com/site/docspace/ui-kit
          cp -r docspace-ui-kit-react/site-docs api.onlyoffice.com/site/docspace/ui-kit

          cd api.onlyoffice.com
          if [ -n "$(git status --porcelain)" ]; then
              git add .
              git commit -m "Update DocSpace UI Kit documentation from GitHub Actions"
              git push origin ${{ github.ref_name }}
            else
              echo "Nothing to commit"
            fi
